<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جميع المستخدمين | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(function () {
    // عرض فقط — الأدمن حصراً (البوابة في الخادم)
    const user = Auth.requireAuth(['admin']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'users', title: 'جميع المستخدمين' });

    const esc = UI.escapeHtml;
    const ROLE = {
        admin:          ['مدير النظام', 'primary'],
        center_manager: ['مدير مركز',   'info'],
        teacher:        ['محفّظ',       'success'],
        parent:         ['ولي أمر',     'secondary'],
    };
    const roleBadge = r => ROLE[r] ? UI.badge(ROLE[r][0], ROLE[r][1]) : esc(r || '—');

    pc.innerHTML = `
        <div class="mq-toolbar">
          <div class="mq-search">${UI.ic('search', 18, '#9A7A1E')}<input id="search" placeholder="ابحث بالاسم أو الكود أو الهاتف أو البريد..."></div>
          <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
            <div style="display:flex;align-items:center;gap:8px;">
              <label class="mq-label" style="margin:0;font-size:13px;white-space:nowrap;">الدور:</label>
              <select class="mq-input" id="role-filter" style="max-width:160px;">
                <option value="">الكل</option>
                <option value="admin">مدير النظام</option>
                <option value="center_manager">مدير المركز</option>
                <option value="teacher">محفّظ</option>
                <option value="parent">ولي أمر</option>
              </select>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <label class="mq-label" style="margin:0;font-size:13px;white-space:nowrap;">الحالة:</label>
              <select class="mq-input" id="status-filter" style="max-width:150px;">
                <option value="active">النشطون</option>
                <option value="inactive">المعطَّلون</option>
                <option value="all">الكل</option>
              </select>
            </div>
            <span id="counter" style="font-size:13px;color:#7A8F82;font-weight:600;white-space:nowrap;"></span>
          </div>
        </div>
        <div class="mq-card"><div class="rp-scroll"><table class="mq-table" id="tbl">
          <thead><tr><th style="width:80px;">الكود</th><th>الاسم</th><th>الدور</th><th>البريد</th><th>الهاتف</th><th>المركز</th><th style="width:100px;text-align:center;">الحالة</th></tr></thead>
          <tbody id="usr-body"><tr><td colspan="7" style="text-align:center;color:#7A8F82;padding:30px;">جارٍ التحميل...</td></tr></tbody>
        </table></div></div>
        <div style="text-align:center;margin-top:16px;">
          <button class="mq-btn mq-btn--secondary" id="load-more" style="display:none;">عرض المزيد ↓</button>
        </div>`;

    const searchInput = document.getElementById('search');
    const counter = document.getElementById('counter');
    const loadMoreBtn = document.getElementById('load-more');
    const roleFilter = document.getElementById('role-filter');
    const statusFilter = document.getElementById('status-filter');
    let page = 1, lastPage = 1, total = 0, loadedCount = 0, fetchSeq = 0;

    async function render(reset = true) {
        if (reset) { page = 1; loadedCount = 0; }
        const seq = ++fetchSeq;
        const body = document.getElementById('usr-body');
        if (reset) body.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#7A8F82;padding:20px;">جارٍ التحميل...</td></tr>`;
        loadMoreBtn.disabled = true;
        try {
            const p = new URLSearchParams({ page, status: statusFilter.value });
            if (roleFilter.value) p.set('role', roleFilter.value);
            const q = searchInput.value.trim();
            if (q) p.set('q', q);
            const res = await API.get('/admin/users?' + p.toString());
            if (seq !== fetchSeq) return;
            const pg = res.data, batch = pg.data || [];
            lastPage = pg.last_page ?? 1; total = pg.total ?? batch.length;
            const rows = batch.map(u => `
                <tr>
                  <td>${u.display_code ? `<span class="mq-code">${esc(u.display_code)}</span>` : '—'}</td>
                  <td><div style="display:flex;align-items:center;gap:10px;">
                    <span class="mq-avatar">${UI.initial(u.name)}</span>
                    <div style="font-weight:600;">${esc(u.name)}</div></div></td>
                  <td>${roleBadge(u.role)}</td>
                  <td style="direction:ltr;text-align:right;font-size:13px;color:#3D6B52;">${esc(u.email || '—')}</td>
                  <td style="direction:ltr;text-align:right;">${esc(u.phone || '—')}</td>
                  <td>${u.center_name ? esc(u.center_name) : '—'}</td>
                  <td style="text-align:center;">${u.is_active ? UI.badge('نشط', 'success') : UI.badge('معطَّل', 'danger')}</td>
                </tr>`).join('');
            if (reset) body.innerHTML = batch.length ? rows : `<tr><td colspan="7" style="text-align:center;color:#7A8F82;padding:30px;">لا يوجد مستخدمون مطابقون</td></tr>`;
            else body.insertAdjacentHTML('beforeend', rows);
            loadedCount += batch.length;
            counter.textContent = total ? `عرض ${loadedCount} من ${total}` : '';
            loadMoreBtn.style.display = page < lastPage ? '' : 'none';
        } catch (e) {
            if (reset) body.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#B23A48;padding:20px;">${esc(e.message)}</td></tr>`;
        } finally { loadMoreBtn.disabled = false; }
    }

    loadMoreBtn.onclick = () => { page++; render(false); };
    roleFilter.addEventListener('change', () => render(true));
    statusFilter.addEventListener('change', () => render(true));
    let t = null;
    searchInput.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => render(true), 300); });
    render(true);
})();
</script>
</body>
</html>

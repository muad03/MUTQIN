<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المركز | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(async function () {
    // الفحص الحاسم في الخادم (بوابة admin) — هذا مجرد توجيه للواجهة
    const user = Auth.requireAuth(['admin']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'centers', title: 'تفاصيل المركز' });

    const id = new URLSearchParams(location.search).get('id');
    if (!id) { pc.innerHTML = '<div class="mq-empty"><h3>لا يوجد مركز محدّد</h3></div>'; return; }

    const esc = UI.escapeHtml;

    // ===== مكوّنات صغيرة =====
    const meta = (lbl, val) => `<div class="mq-center-meta-item">
        <div class="mq-center-meta-lbl">${lbl}</div>
        <div class="mq-center-meta-val">${esc(val ?? '—')}</div></div>`;
    const stat = (v, l, k, sub = '') => `<div class="mq-stat ${k}"><span class="mq-stat-ico">${UI.star(22)}</span>
        <div><div class="mq-stat-val">${v}</div><div class="mq-stat-lbl">${l}</div>${sub ? `<div class="mq-stat-sub">${sub}</div>` : ''}</div></div>`;
    const section = (title, sid) => `
        <div class="mq-section"><h3 class="mq-section-title">${title}</h3><span class="mq-section-count" id="${sid}-count"></span></div>`;

    // ===== 1) الرأس + 2) البطاقات + 3) المدير — من endpoint الإحصائيات =====
    let data;
    try {
        data = (await API.get('/centers/' + encodeURIComponent(id) + '/stats')).data;
    } catch (e) {
        pc.innerHTML = `<div class="mq-empty"><h3>تعذّر عرض المركز</h3><p>${esc(e.message)}</p></div>`;
        return;
    }
    const c = data.center || {}, st = data.stats || {}, m = data.manager;
    const monthLbl = `${st.month}/${st.year}`;

    const managerHtml = m ? `
        <div class="mq-card"><div class="mq-card-body mq-manager">
          <span class="mq-avatar mq-manager-avatar">${UI.initial(m.name)}</span>
          <div class="mq-manager-info">
            <div class="mq-center-head-top">
              <span class="mq-manager-name">${esc(m.name)}</span>
              ${m.display_code ? `<span class="mq-code">${esc(m.display_code)}</span>` : ''}
              ${UI.badge('نشط', 'success')}
            </div>
            <div class="mq-manager-mail">${esc(m.email || '—')}</div>
          </div>
          <div class="mq-manager-phone">📞 ${esc(m.phone || '—')}</div>
        </div></div>`
        : `<div class="mq-manager-empty">لا يوجد مدير للمركز</div>`;

    pc.innerHTML = `
        <a class="mq-btn mq-btn--secondary mq-btn--sm" href="centers.html" style="margin-bottom:16px;">→ العودة للمراكز</a>

        <div class="mq-card" style="margin-bottom:20px;"><div class="mq-card-body mq-center-head">
          <div class="mq-center-head-top">
            <h2 class="mq-center-name">${esc(c.name || '—')}</h2>
            ${c.display_code ? `<span class="mq-code" style="font-size:14px;">${esc(c.display_code)}</span>` : ''}
            ${c.is_active ? UI.badge('نشط', 'success') : UI.badge('غير نشط', 'danger')}
          </div>
          <div class="mq-center-meta">
            ${meta('🏙️ المدينة', c.city)}${meta('📍 العنوان', c.address)}${meta('📞 الهاتف', c.phone)}
            ${meta('📅 تاريخ الإنشاء', c.created_at ? UI.fmtDate(c.created_at) : null)}
          </div>
        </div></div>

        <div class="mq-stats">
          ${stat(st.students_active ?? 0, 'طالب نشط', 'green')}
          ${stat(st.teachers_active ?? 0, 'محفّظ نشط', 'gold')}
          ${stat((st.attendance_percent ?? 0) + '%', 'نسبة الحضور (' + monthLbl + ')', 'blue',
              `حاضر ${st.attendance_month?.present ?? 0} من ${st.attendance_month?.total ?? 0} سجلاً`)}
          ${stat(st.students_without_teacher ?? 0, 'طالب بلا محفّظ', (st.students_without_teacher ?? 0) ? 'orange' : 'green')}
          ${stat(st.students_inactive ?? 0, 'طالب موقوف', 'red')}
          ${stat((st.tests_month?.pass_percent ?? 0) + '%', 'نجاح اختبارات الشهر', 'gold',
              `ناجح ${st.tests_month?.passed ?? 0} من ${st.tests_month?.total ?? 0} اختباراً`)}
          ${stat(st.attendance_today?.present ?? 0, 'حاضر اليوم', 'blue',
              `متأخر ${st.attendance_today?.late ?? 0} · غائب ${st.attendance_today?.absent ?? 0}`)}
        </div>

        ${section('👤 مدير المركز', 'mgr')}
        ${managerHtml}

        ${section('🧑‍🏫 المحفّظون', 'tch')}
        <div class="mq-card"><div class="rp-scroll"><table class="mq-table">
          <thead><tr><th style="width:75px;">الكود</th><th>الاسم</th><th>النوع</th><th style="width:110px;text-align:center;">طلابه النشطون</th><th>الهاتف</th><th style="width:95px;text-align:center;">الحالة</th></tr></thead>
          <tbody id="tch-body"><tr><td colspan="6" style="text-align:center;color:#7A8F82;padding:18px;">جارٍ التحميل...</td></tr></tbody>
        </table></div>
        <div class="mq-more" id="tch-more" hidden><button class="mq-btn mq-btn--secondary mq-btn--sm" id="tch-more-btn">إظهار المزيد ↓</button></div></div>

        ${section('👥 الطلاب', 'stu')}
        <div class="mq-card"><div class="rp-scroll"><table class="mq-table">
          <thead><tr><th style="width:75px;">الكود</th><th>الطالب</th><th style="width:70px;">العمر</th><th>المحفّظ</th><th>الرقم الوطني</th><th style="width:95px;text-align:center;">الحالة</th></tr></thead>
          <tbody id="stu-body"><tr><td colspan="6" style="text-align:center;color:#7A8F82;padding:18px;">جارٍ التحميل...</td></tr></tbody>
        </table></div>
        <div class="mq-more" id="stu-more" hidden><button class="mq-btn mq-btn--secondary mq-btn--sm" id="stu-more-btn">إظهار المزيد ↓</button></div></div>`;

    // ===== 4) و5) القوائم المختصرة مع «إظهار المزيد» — الترقيم من الخادم =====
    const teacherRow = t => `
        <tr>
          <td>${t.display_code ? `<span class="mq-code">${esc(t.display_code)}</span>` : '—'}</td>
          <td style="font-weight:600;">${esc(t.name)}</td>
          <td>${t.type === 'محفظ أساسي' ? UI.badge('محفظ أساسي', 'success') : UI.badge('محفظ معاون', 'secondary')}</td>
          <td style="text-align:center;">${UI.badge((t.active_students_count ?? 0) + ' طالب', 'info')}</td>
          <td>${esc(t.phone || '—')}</td>
          <td style="text-align:center;">${t.is_active ? UI.badge('نشط', 'success') : UI.badge('غير نشط', 'danger')}</td>
        </tr>`;
    const studentRow = s => `
        <tr>
          <td>${s.display_code ? `<span class="mq-code">${esc(s.display_code)}</span>` : '—'}</td>
          <td><div style="font-weight:600;">${esc(s.name)}</div>
            <div style="font-size:11.5px;color:#9DB3A6;">${esc(s.guardian_name || '')}</div></td>
          <td>${s.age ?? '—'}</td>
          <td>${s.teacher ? esc(s.teacher.name)
              : (s.former_teacher_name
                  ? `<span style="color:#9A7A1E;">سابقاً: ${esc(s.former_teacher_name)}</span>`
                  : '<span style="color:#B23A48;font-weight:700;">— بدون محفّظ —</span>')}</td>
          <td>${s.national_id
              ? `<span style="direction:ltr;display:inline-block;font-weight:600;color:#04532F;">${esc(s.national_id)}</span>`
              : '<span class="mq-badge mq-badge-warning">بدون رقم</span>'}</td>
          <td style="text-align:center;">${s.is_active ? UI.badge('نشط', 'success') : UI.badge('موقوف', 'danger')}</td>
        </tr>`;

    // قائمة مرقّمة عامة: تحمّل صفحة، تُلحق الصفوف، وتُظهر الزر ما دامت هناك صفحات
    function pagedList({ key, path, row, empty }) {
        const body = document.getElementById(key + '-body');
        const more = document.getElementById(key + '-more');
        const btn = document.getElementById(key + '-more-btn');
        const count = document.getElementById(key + '-count');
        let page = 0, lastPage = 1, total = 0, loaded = 0;

        async function loadNext() {
            btn.disabled = true;
            try {
                const res = await API.get(path + '?page=' + (page + 1));
                const pg = res.data, batch = pg.data || [];
                page = pg.current_page ?? page + 1; lastPage = pg.last_page ?? 1; total = pg.total ?? batch.length;
                const html = batch.map(row).join('');
                if (page === 1) body.innerHTML = batch.length ? html : `<tr><td colspan="6" style="text-align:center;color:#9DB3A6;padding:18px;">${empty}</td></tr>`;
                else body.insertAdjacentHTML('beforeend', html);
                loaded += batch.length;
                count.textContent = total ? `عرض ${loaded} من ${total} (النشطون)` : '';
                more.hidden = !(page < lastPage);
            } catch (e) {
                if (page === 0) body.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#B23A48;padding:18px;">${esc(e.message)}</td></tr>`;
                else UI.toast(e.message, 'danger');
            } finally { btn.disabled = false; }
        }
        btn.onclick = loadNext;
        return loadNext();
    }

    const base = '/centers/' + encodeURIComponent(id);
    await Promise.all([
        pagedList({ key: 'tch', path: base + '/teachers', row: teacherRow, empty: 'لا يوجد محفّظون نشطون في هذا المركز' }),
        pagedList({ key: 'stu', path: base + '/students', row: studentRow, empty: 'لا طلاب نشطون في هذا المركز' }),
    ]);
})();
</script>
</body>
</html>

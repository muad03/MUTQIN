<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المركز | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(async function () {
    const user = Auth.requireAuth(['admin']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'centers', title: 'تفاصيل المركز' });

    const id = new URLSearchParams(location.search).get('id');
    if (!id) { pc.innerHTML = '<div class="mq-empty"><h3>لا يوجد مركز محدّد</h3></div>'; return; }

    const info = (lbl, val) => `<div style="padding:11px 13px;background:var(--ivory-soft);border-radius:10px;">
        <div style="font-size:11.5px;color:#7A8F82;margin-bottom:2px;">${lbl}</div>
        <div style="font-size:14px;font-weight:700;color:#04361F;">${UI.escapeHtml(val ?? '—')}</div></div>`;
    const stat = (v, l, k) => `<div class="mq-stat ${k}"><span class="mq-stat-ico">${UI.star(22)}</span>
        <div><div class="mq-stat-val">${v}</div><div class="mq-stat-lbl">${l}</div></div></div>`;
    const sectionTitle = (t, extra = '') => `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px;">
          <h3 style="font-family:'Amiri',serif;font-size:22px;color:#04361F;margin:0;">${t}</h3>${extra}
        </div>`;

    try {
        // ثلاث جلبات متوازية: المركز (بمحفّظيه) + كل المدراء (نرشّح مدير هذا المركز) + طلاب المركز كاملين
        const [cRes, mRes, sRes] = await Promise.all([
            API.get('/centers/' + id),
            API.get('/admin/managers'),
            API.get('/students?center_id=' + encodeURIComponent(id) + '&status=all&all=1'),
        ]);
        const c = cRes.data || {};
        const managers = (mRes.data || []).filter(m => String(m.center_id) === String(id));
        const students = sRes.data.data || sRes.data || [];

        // عدد طلاب كل محفّظ (نشطون فقط — كدلالة الحمل الحالي)
        const perTeacher = {};
        students.forEach(s => { if (s.teacher_id && s.is_active) perTeacher[s.teacher_id] = (perTeacher[s.teacher_id] || 0) + 1; });
        const activeStudents = students.filter(s => s.is_active).length;
        const noTeacher = students.filter(s => !s.teacher_id && s.is_active).length;

        // ===== 1) مدير المركز (وقد يكون معه معطَّل سابق — يُعرض بشارته) =====
        const managerCards = managers.length ? managers
            .sort((a, b) => (b.is_active ? 1 : 0) - (a.is_active ? 1 : 0))
            .map(m => `
              <div class="mq-card" style="margin:0;${m.is_active ? '' : 'opacity:.75;'}">
                <div class="mq-card-body" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
                  <span class="mq-avatar" style="width:54px;height:54px;font-size:22px;border-radius:14px;">${UI.initial(m.name)}</span>
                  <div style="flex:1;min-width:200px;">
                    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                      <strong style="font-size:16.5px;color:#04361F;">${UI.escapeHtml(m.name)}</strong>
                      ${m.display_code ? `<span class="mq-code">${UI.escapeHtml(m.display_code)}</span>` : ''}
                      ${m.is_active ? UI.badge('نشط', 'success') : UI.badge('معطَّل', 'danger')}
                    </div>
                    <div style="font-size:12.5px;color:#7A8F82;direction:ltr;text-align:right;margin-top:3px;">${UI.escapeHtml(m.email)}</div>
                  </div>
                  <div style="font-size:13.5px;color:#3D6B52;font-weight:600;">📞 ${UI.escapeHtml(m.phone || '—')}</div>
                </div>
              </div>`).join('')
            : `<div style="background:rgba(212,175,55,.14);border:1.5px solid #D4AF37;border-radius:13px;padding:15px 18px;color:#9A7A1E;font-weight:700;">
                 ⚠ لا مدير لهذا المركز — تديره إدارة النظام مباشرة، وطلبات النقل الداخلية تؤول لمدير النظام.
               </div>`;

        // ===== 2) المحفّظون =====
        const teacherRows = (c.teachers || []).length ? c.teachers.map(t => `
            <tr>
              <td>${t.display_code ? `<span class="mq-code">${UI.escapeHtml(t.display_code)}</span>` : '—'}</td>
              <td style="font-weight:600;">${UI.escapeHtml(t.name)}</td>
              <td>${t.type === 'محفظ أساسي' ? UI.badge('محفظ أساسي', 'success') : UI.badge('محفظ معاون', 'secondary')}</td>
              <td style="text-align:center;">${UI.badge((perTeacher[t.id] || 0) + ' طالب', 'info')}</td>
              <td style="font-size:12.5px;direction:ltr;text-align:right;color:#7A8F82;">${UI.escapeHtml(t.email || '—')}</td>
              <td style="text-align:center;">${t.is_active ? UI.badge('نشط', 'success') : UI.badge('غير نشط', 'danger')}</td>
            </tr>`).join('')
            : `<tr><td colspan="6" style="text-align:center;color:#9DB3A6;padding:18px;">لا يوجد محفّظون في هذا المركز</td></tr>`;

        // ===== 3) الطلاب =====
        const studentRows = students.length ? students.map(s => `
            <tr>
              <td>${s.display_code ? `<span class="mq-code">${UI.escapeHtml(s.display_code)}</span>` : '—'}</td>
              <td><div style="font-weight:600;">${UI.escapeHtml(s.name)}</div>
                <div style="font-size:11.5px;color:#9DB3A6;">${UI.escapeHtml(s.guardian_name || '')}</div></td>
              <td>${s.age ?? '—'}</td>
              <td>${s.teacher ? UI.escapeHtml(s.teacher.name)
                  : (s.former_teacher_name
                      ? `<span style="color:#9A7A1E;">سابقاً: ${UI.escapeHtml(s.former_teacher_name)}</span>`
                      : '<span style="color:#B23A48;font-weight:700;">— بدون محفّظ —</span>')}</td>
              <td>${s.national_id
                  ? `<span style="direction:ltr;display:inline-block;font-weight:600;color:#04532F;">${UI.escapeHtml(s.national_id)}</span>`
                  : '<span class="mq-badge mq-badge-warning">بدون رقم</span>'}</td>
              <td style="text-align:center;">${s.is_active ? UI.badge('نشط', 'success') : UI.badge('موقوف', 'danger')}</td>
            </tr>`).join('')
            : `<tr><td colspan="6" style="text-align:center;color:#9DB3A6;padding:18px;">لا طلاب في هذا المركز</td></tr>`;

        pc.innerHTML = `
            <a class="mq-btn mq-btn--secondary mq-btn--sm" href="centers.html" style="margin-bottom:16px;">→ العودة للمراكز</a>

            <!-- بطاقة المركز -->
            <div class="mq-card" style="margin-bottom:20px;"><div class="mq-card-body">
              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
                <h2 style="font-family:'Amiri',serif;font-size:26px;margin:0;color:#04361F;">${UI.escapeHtml(c.name || '—')}</h2>
                ${c.display_code ? `<span class="mq-code" style="font-size:14px;">${UI.escapeHtml(c.display_code)}</span>` : ''}
                ${c.is_active ? UI.badge('نشط', 'success') : UI.badge('غير نشط', 'danger')}
              </div>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;">
                ${info('🏙️ المدينة', c.city)}${info('📍 العنوان', c.address)}${info('📞 الهاتف', c.phone)}
              </div>
            </div></div>

            <div class="mq-stats">
              ${stat(activeStudents, 'طالب نشط', 'green')}
              ${stat(students.length - activeStudents, 'طالب موقوف', 'red')}
              ${stat((c.teachers || []).length, 'محفّظ', 'gold')}
              ${stat(noTeacher, 'بلا محفّظ', noTeacher ? 'orange' : 'blue')}
            </div>

            ${sectionTitle('👤 مدير المركز')}
            <div style="display:flex;flex-direction:column;gap:12px;">${managerCards}</div>

            ${sectionTitle('🧑‍🏫 المحفّظون (' + (c.teachers || []).length + ')')}
            <div class="mq-card"><div class="rp-scroll"><table class="mq-table">
              <thead><tr><th style="width:75px;">الكود</th><th>الاسم</th><th>النوع</th><th style="width:110px;text-align:center;">طلابه</th><th>البريد</th><th style="width:95px;text-align:center;">الحالة</th></tr></thead>
              <tbody>${teacherRows}</tbody></table></div></div>

            ${sectionTitle('👥 الطلاب (' + students.length + ')',
              `<div class="mq-search" style="max-width:320px;">${UI.ic('search', 17, '#9A7A1E')}<input id="stu-search" placeholder="ابحث في طلاب المركز..."></div>`)}
            <div class="mq-card"><div class="rp-scroll"><table class="mq-table" id="stu-tbl">
              <thead><tr><th style="width:75px;">الكود</th><th>الطالب</th><th style="width:70px;">العمر</th><th>المحفّظ</th><th>الرقم الوطني</th><th style="width:95px;text-align:center;">الحالة</th></tr></thead>
              <tbody>${studentRows}</tbody></table></div></div>`;

        UI.bindTableSearch('stu-search', 'stu-tbl');
    } catch (e) {
        pc.innerHTML = `<div class="mq-empty"><h3>تعذّر عرض المركز</h3><p>${UI.escapeHtml(e.message)}</p></div>`;
    }
})();
</script>
</body>
</html>

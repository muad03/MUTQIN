<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملفّي الشخصي | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(function () {
    // ملف الأدمن — تغيير كلمة المرور فقط؛ الخادم يبطل كل التوكنات بعد التغيير
    const user = Auth.requireAuth(['admin']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'profile', title: 'ملفّي الشخصي' });

    async function load() {
        pc.innerHTML = '<div class="mq-card"><div class="mq-card-body pf-loading">جارٍ التحميل...</div></div>';
        let d;
        try { d = (await API.get('/profile')).data; }
        catch (e) { UI.toast(e.message, 'danger'); return; }

        pc.innerHTML = `
          <div class="pf-grid">
            <!-- بطاقة العرض (للقراءة فقط): الاسم والبريد والدور -->
            <div class="mq-card">
              <div class="pf-hero">
                <span class="mq-avatar pf-avatar">${UI.initial(d.name)}</span>
                <div class="pf-hero-main">
                  <div class="pf-name-row"><h2 class="pf-name">${UI.escapeHtml(d.name || '—')}</h2></div>
                  <span class="pf-type">مدير النظام</span>
                </div>
              </div>
              <div class="mq-card-body">
                <div class="pf-info">
                  <div class="pf-item"><div class="pf-item-lbl">الاسم</div><div class="pf-item-val">${UI.escapeHtml(d.name || '—')}</div></div>
                  <div class="pf-item"><div class="pf-item-lbl">الدور</div><div class="pf-item-val">مدير النظام</div></div>
                  <div class="pf-item"><div class="pf-item-lbl">البريد الإلكتروني</div><div class="pf-item-val pf-item-val--ltr">${UI.escapeHtml(d.email || '—')}</div></div>
                </div>
                <p class="pf-note">الدخول بالبريد وكلمة المرور — بعد تغييرها تُنهى كل جلساتك وتدخل بالكلمة الجديدة.</p>
              </div>
            </div>

            <!-- تغيير كلمة المرور فقط -->
            <div class="pf-forms">
              <div class="mq-card">
                <div class="mq-card-header"><h3 class="mq-card-title">تغيير كلمة المرور</h3></div>
                <form class="mq-card-body" id="pass-form">
                  <div class="pf-field">
                    <label class="mq-label">كلمة المرور الحالية</label>
                    <input class="mq-input" name="current_password" type="password" autocomplete="current-password">
                    <div class="mq-field-error" data-error="current_password"></div>
                  </div>
                  <div class="pf-field">
                    <label class="mq-label">كلمة المرور الجديدة</label>
                    <input class="mq-input" name="password" type="password" autocomplete="new-password">
                    <div class="mq-field-error" data-error="password"></div>
                  </div>
                  <div class="pf-field">
                    <label class="mq-label">تأكيد الكلمة الجديدة</label>
                    <input class="mq-input" name="password_confirmation" type="password" autocomplete="new-password">
                  </div>
                  <div class="pf-hint">بعد التغيير ستُسجَّل خروجاً وتدخل بالكلمة الجديدة.</div>
                  <div class="pf-actions"><button type="submit" class="mq-btn mq-btn--gold mq-btn--sm">تغيير كلمة المرور</button></div>
                </form>
              </div>
            </div>
          </div>`;

        // ===== تغيير كلمة المرور — نفس النقطة والحقول والسلوك في صفحة المحفّظ =====
        document.getElementById('pass-form').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            UI.setFieldErrors(null);
            const f = ev.target;
            try {
                const res = await API.post('/profile/password', {
                    current_password: f.current_password.value,
                    password: f.password.value,
                    password_confirmation: f.password_confirmation.value,
                });
                UI.toast(res.message || 'تم تغيير كلمة المرور');
                setTimeout(() => {
                    localStorage.removeItem(window.MutqinConfig.STORAGE_TOKEN);
                    localStorage.removeItem(window.MutqinConfig.STORAGE_USER);
                    location.href = window.MutqinConfig.APP_ROOT + 'login.html';
                }, 1600);
            } catch (e) {
                UI.setFieldErrors(e.errors);
                if (!e.errors || !Object.keys(e.errors).length) UI.toast(e.message, 'danger');
            }
        });
    }
    load();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المراكز | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(function () {
    const user = Auth.requireAuth(['admin']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'centers', title: 'إدارة المراكز' });

    const fields = (c = {}) => [
        { name: 'name', label: 'اسم المركز', required: true, value: c.name },
        { name: 'city', label: 'المدينة', value: c.city, placeholder: 'مثال: طرابلس، بنغازي' },
        { name: 'address', label: 'العنوان', value: c.address },
        { name: 'phone', label: 'رقم الهاتف', value: c.phone },
    ];

    // تفاصيل المركز صارت صفحة مستقلة (center.html?id=) — الصف كله قابل للنقر
    const openCenterPage = (id) => { location.href = 'center.html?id=' + encodeURIComponent(id); };

    function rowsHtml(centers) {
        return centers.map(c => `
            <tr data-row="${c.id}" style="cursor:pointer;" title="عرض تفاصيل المركز">
              <td>${c.display_code ? `<span class="mq-code">${UI.escapeHtml(c.display_code)}</span>` : '—'}</td>
              <td style="font-weight:600;">${UI.escapeHtml(c.name)}</td>
              <td>${c.city ? UI.badge(UI.escapeHtml(c.city), 'primary') : '—'}</td>
              <td>${UI.escapeHtml(c.address || '—')}</td>
              <td>${UI.escapeHtml(c.phone || '—')}</td>
              <td>${UI.badge((c.students_count ?? 0) + ' طالب', 'info')}</td>
              <td style="text-align:center;">${c.is_active ? UI.badge('نشط', 'success') : UI.badge('غير نشط', 'danger')}</td>
              <td><div class="mq-actions">
                ${UI.actionBtn('view', `data-details="${c.id}" title="تفاصيل"`)}
                ${UI.actionBtn('edit', `data-edit="${c.id}" title="تعديل"`)}
                <button class="mq-btn ${c.is_active ? 'mq-btn--quiet-danger' : 'mq-btn--quiet'} mq-btn--icon mq-btn--sm"
                        data-toggle="${c.id}" title="${c.is_active ? 'تعطيل المركز' : 'تفعيل المركز'}">
                  ${c.is_active
                    ? '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>'
                    : '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>'}
                </button>
              </div></td>
            </tr>`).join('') || `<tr><td colspan="8" style="text-align:center;color:#7A8F82;padding:30px;">لا توجد مراكز</td></tr>`;
    }

    async function load() {
        pc.innerHTML = '<div class="mq-card"><div class="mq-card-body">جارٍ التحميل...</div></div>';
        try {
            const res0 = await API.get('/centers?all=1');
            const centers = res0.data.data || res0.data || [];

            pc.innerHTML = `
                <div class="mq-toolbar">
                  <div class="mq-search">${UI.ic('search', 18, '#9A7A1E')}<input id="search" placeholder="ابحث في أي عمود: الكود، الاسم، المدينة، العنوان، الهاتف..."></div>
                  <button class="mq-btn mq-btn--primary" id="add">${UI.ic('plus', 17)} مركز جديد</button>
                </div>
                <div class="mq-card"><table class="mq-table" id="tbl">
                  <thead><tr>
                    <th style="width:80px;">الكود</th><th>اسم المركز</th><th>المدينة</th><th>العنوان</th>
                    <th>الهاتف</th><th>الطلاب</th><th style="width:100px;text-align:center;">الحالة</th><th style="width:150px;">الإجراءات</th>
                  </tr></thead>
                  <tbody id="ctr-body">${rowsHtml(centers)}</tbody></table></div>`;

            function bindRowActions(list) {
                const body = document.getElementById('ctr-body');
                // الصف كله يفتح صفحة التفاصيل — عدا النقر على أزرار الإجراءات
                body.querySelectorAll('tr[data-row]').forEach(tr => tr.onclick = (e) => {
                    if (e.target.closest('button')) return;
                    openCenterPage(tr.dataset.row);
                });
                body.querySelectorAll('[data-details]').forEach(b => b.onclick = () => openCenterPage(b.dataset.details));
                body.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
                    const c = list.find(x => x.id == b.dataset.edit);
                    UI.formModal({ title: 'تعديل المركز', submitText: 'حفظ التعديلات', fields: fields(c),
                        onSubmit: async (v, h) => { await API.put('/centers/' + c.id, v); UI.toast('تم التحديث'); h.close(); load(); } });
                });
                // تفعيل/تعطيل — بديل الحذف: التاريخ يبقى كاملاً
                body.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
                    const c = list.find(x => x.id == b.dataset.toggle);
                    const deact = !!c.is_active;
                    const html = deact
                        ? `تعطيل مركز <strong>${UI.escapeHtml(c.name)}</strong>؟<br>`
                          + `<span style="color:#B23A48;font-weight:700;">سيُمنع محفّظوه ومدير المركز من الدخول، وتُنهى جلساتهم فوراً.</span><br>`
                          + `<span style="color:#7A8F82;">تبقى كل بياناته وطلابه وسجلّاته كما هي، ولن يظهر في قوائم إضافة الطلاب والمحفّظين. يمكن إعادة تفعيله لاحقاً.</span>`
                        : `تفعيل مركز <strong>${UI.escapeHtml(c.name)}</strong>؟<br>`
                          + `<span style="color:#7A8F82;">سيعود منتسبوه للدخول ويظهر في قوائم الإضافة.</span>`;
                    const ok = await UI.confirmAction({
                        title: deact ? 'تعطيل المركز' : 'تفعيل المركز',
                        html, okText: deact ? 'تأكيد التعطيل' : 'تأكيد التفعيل', cancelText: 'إلغاء',
                    });
                    if (!ok) return;
                    try {
                        const r = await API.put('/centers/' + c.id + '/status', { is_active: !c.is_active });
                        UI.toast(r.message || 'تم تحديث الحالة');
                        load();
                    } catch (e) { UI.toast(e.message, 'danger'); }
                });
            }

            UI.bindTableSearch('search', 'tbl');
            bindRowActions(centers);
            document.getElementById('add').onclick = () => UI.formModal({
                title: 'إضافة مركز', fields: fields(),
                onSubmit: async (v, h) => { await API.post('/centers', v); UI.toast('تم إضافة المركز'); h.close(); load(); }
            });
        } catch (e) { UI.toast(e.message, 'danger'); }
    }
    load();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقارير | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(function () {
    // النطاق يُفرض في الخادم (بوابة manager + تضييق المركز داخل المتحكم) — لا فلترة هنا
    const user = Auth.requireAuth(['center_manager']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'reports', title: 'تقارير مركزي' });

    const esc = UI.escapeHtml;
    const el = id => document.getElementById(id);
    const now = new Date();
    const curPeriod = `month=${now.getMonth() + 1}&year=${now.getFullYear()}`; // للـPDF والمتعثّرين القائمين (شهريان)

    // ===== مكوّنات صغيرة =====
    const stat = (v, l, k, sub = '') => `<div class="mq-stat ${k || ''}"><span class="mq-stat-ico">${UI.star(22)}</span>
        <div><div class="mq-stat-val">${v}</div><div class="mq-stat-lbl">${l}</div>${sub ? `<div class="mq-stat-sub">${sub}</div>` : ''}</div></div>`;
    const info = (lbl, val) => `<div class="mq-center-meta-item">
        <div class="mq-center-meta-lbl">${lbl}</div>
        <div class="mq-center-meta-val">${esc(val ?? '—')}</div></div>`;
    const QUALITY = { excellent: ['ممتاز', 'success'], good: ['جيد', 'primary'], average: ['مقبول', 'warning'], weak: ['ضعيف', 'danger'] };
    const qualityChips = q => Object.keys(QUALITY).map(k => `<span class="mq-badge mq-badge-${QUALITY[k][1]}">${QUALITY[k][0]}: ${q?.[k] ?? 0}</span>`).join('');
    const pctColor = p => p < 70 ? '#B23A48' : '#04532F';

    // بطاقات الحضور/الاختبارات/الحفظ المشتركة بين الأقسام الثلاثة (نفس المفاتيح من الخادم)
    // opts.single: تقرير طالب واحد — بطاقتا المتوسط والختمات تُعرضان في قسم التقدّم الخاص به
    function commonStats(d, opts = {}) {
        const a = d.attendance || {}, t = d.tests || {}, m = d.memorization || {};
        return `
            ${stat(a.percent + '%', 'نسبة الحضور', 'blue', `حاضر ${a.present} من ${a.total} سجلاً`)}
            ${stat(a.absent, 'عدد الغياب', 'red', `متأخر ${a.late}`)}
            ${stat(a.absent_percent + '%', 'نسبة الغياب', 'red')}
            ${stat(`${t.passed} / ${t.total}`, 'نتائج الاختبارات (ناجح / الكل)', 'gold', `راسب ${t.failed}`)}
            ${stat(t.pass_percent + '%', 'نسبة الناجحين', 'gold')}
            ${opts.single ? '' : stat(m.avg_completed_juz, 'متوسّط الأجزاء المكتملة', 'blue', `${m.records} سجل حفظ`)}
            ${opts.single ? '' : stat(m.khatmat, 'الختمات', m.khatmat ? 'gold' : 'green', 'أتمّوا 30 جزءاً')}`;
    }

    pc.innerHTML = `
        <div class="rp-stack">
          <section class="mq-card" id="sec-center">
            <div class="mq-card-header"><h3 class="mq-card-title">📊 تقرير المركز</h3>
              <div class="rp-actions">
                <button class="mq-btn mq-btn--secondary mq-btn--sm" id="pdf-center">${UI.ic('report',15)} PDF الشامل</button>
                <button class="mq-btn mq-btn--secondary mq-btn--sm" id="pdf-atrisk">${UI.ic('report',15)} PDF المتعثّرين</button>
              </div></div>
            <div class="mq-card-body" id="center-body">جارٍ التحميل...</div>
          </section>

          <section class="mq-card" id="sec-teacher">
            <div class="mq-card-header"><h3 class="mq-card-title">👨‍🏫 تقارير المحفّظين</h3>
              <button class="mq-btn mq-btn--secondary mq-btn--sm" id="pdf-teachers">${UI.ic('report',15)} PDF أداء المحفّظين</button></div>
            <div class="mq-card-body">
              <div class="rp-pick">
                <label class="mq-label" for="teacher-pick">اختر محفّظاً</label>
                <select class="mq-input" id="teacher-pick"><option value="">— اختر —</option></select>
              </div>
              <div id="teacher-body" class="rp-result"></div>
            </div>
          </section>

        </div>`;

    el('pdf-center').onclick  = () => UI.openPdf('/manager/reports/center/pdf?' + curPeriod);
    el('pdf-atrisk').onclick  = () => UI.openPdf('/manager/reports/at-risk/pdf?' + curPeriod);
    el('pdf-teachers').onclick = () => UI.openPdf('/manager/reports/teachers/pdf?' + curPeriod);

    // ===== 1) تقرير المركز — كل السجلات، النشطون فقط =====
    async function loadCenter() {
        const box = el('center-body');
        let d, risk = null;
        try { d = (await API.get('/manager/reports/center')).data; }
        catch (e) { box.innerHTML = `<div class="mq-empty">${esc(e.message)}</div>`; return; }
        try { risk = (await API.get('/manager/reports/system?' + curPeriod)).data.atRisk; } catch (e) { risk = null; }

        const riskRows = risk ? ((risk.rows || []).length ? risk.rows.map(r => `<tr>
              <td>${r.student.display_code ? `<span class="mq-code">${esc(r.student.display_code)}</span>` : '—'}</td>
              <td style="font-weight:600;">${esc(r.student.name)}</td>
              <td>${esc(r.student.teacher?.name || '— بدون محفّظ —')}</td>
              <td style="text-align:center;font-weight:700;color:${pctColor(r.attendancePercent)};">${r.attendancePercent}%</td>
              <td style="text-align:center;">${r.fails}</td>
              <td>${UI.badge(r.reason, 'warning')}</td></tr>`).join('')
            : `<tr><td colspan="6" style="text-align:center;color:#04532F;padding:18px;">✓ لا يوجد طلاب متعثّرون هذا الشهر</td></tr>`) : '';

        box.innerHTML = `
            <div class="rp-section-sub" style="margin-bottom:14px;">${esc(d.center?.name || '')} · كل السجلات · الطلاب والمحفّظون النشطون فقط</div>
            <div class="mq-stats">
              ${stat(d.students_count, 'عدد الطلاب', 'green')}
              ${stat(d.teachers_count, 'عدد المحفّظين', 'gold')}
              ${commonStats(d)}
            </div>
            <div class="rp-quality"><span class="rp-quality-lbl">جودة سجلات الحفظ:</span>${qualityChips(d.memorization?.quality)}</div>
            ${risk ? `
            <div class="mq-section"><h3 class="mq-section-title">⚠️ الطلاب المتعثّرون (الشهر الحالي)</h3>
              <span class="mq-section-count">حضور أقل من ${risk.attThreshold}% أو رسوب ${risk.failThreshold} مرات فأكثر</span></div>
            <div class="rp-scroll"><table class="mq-table">
              <thead><tr><th>الكود</th><th>الطالب</th><th>المحفّظ</th><th style="text-align:center;">الحضور</th><th style="text-align:center;">مرات الرسوب</th><th>السبب</th></tr></thead>
              <tbody>${riskRows}</tbody></table></div>` : ''}`;
    }

    // ===== 2) تقارير المحفّظين — دروب داون ثم التقرير =====
    async function initTeachers() {
        const sel = el('teacher-pick');
        try {
            const list = (await API.get('/manager/teachers?all=1&status=active')).data || [];
            sel.innerHTML = '<option value="">— اختر —</option>' + list.map(t =>
                `<option value="${t.id}">${esc(t.name)}${t.display_code ? ' (' + esc(t.display_code) + ')' : ''}</option>`).join('');
            if (!list.length) el('teacher-body').innerHTML = '<div class="rp-section-sub">لا يوجد محفّظون نشطون في مركزك</div>';
        } catch (e) { el('teacher-body').innerHTML = `<div class="mq-empty">${esc(e.message)}</div>`; }
        sel.onchange = () => sel.value ? loadTeacher(sel.value) : (el('teacher-body').innerHTML = '');
    }

    async function loadTeacher(id) {
        const box = el('teacher-body');
        box.innerHTML = 'جارٍ التحميل...';
        let d;
        try { d = (await API.get('/manager/reports/teacher/' + encodeURIComponent(id))).data; }
        catch (e) { box.innerHTML = `<div class="mq-empty">${esc(e.message)}</div>`; return; }
        const t = d.teacher || {};
        const rows = (d.students || []).length ? d.students.map(s => `<tr>
              <td>${s.display_code ? `<span class="mq-code">${esc(s.display_code)}</span>` : '—'}</td>
              <td style="font-weight:600;">${esc(s.name)}</td>
              <td style="text-align:center;font-weight:700;color:${pctColor(s.attendance_percent)};">${s.attendance_total ? s.attendance_percent + '%' : '—'}</td>
              <td style="text-align:center;">${s.absent}</td>
              <td style="text-align:center;">${s.tests_total ? `${s.tests_passed} / ${s.tests_total} (${s.pass_percent}%)` : '—'}</td>
              <td>${s.completed_quran ? UI.badge('ختمة كاملة', 'success') : `<strong style="color:#04532F;">${s.completed_juz}</strong> <span style="font-size:12px;color:#7A8F82;">جزءاً${s.reached_juz ? ' · الجزء الحالي ' + s.reached_juz : ''}</span>`}</td>
            </tr>`).join('')
            : `<tr><td colspan="6" style="text-align:center;color:#9DB3A6;padding:18px;">لا يوجد طلاب مسجلون</td></tr>`;

        box.innerHTML = `
            <div class="mq-center-head-top" style="margin-bottom:14px;">
              <span class="mq-avatar">${UI.initial(t.name)}</span>
              <strong style="font-size:17px;color:#04361F;">${esc(t.name)}</strong>
              ${t.display_code ? `<span class="mq-code">${esc(t.display_code)}</span>` : ''}
              ${t.type === 'محفظ أساسي' ? UI.badge('محفظ أساسي', 'success') : UI.badge('محفظ معاون', 'secondary')}
              ${t.is_active ? '' : UI.badge('موقوف', 'danger')}
            </div>
            <div class="mq-stats">
              ${stat(d.students_count, 'طلابه النشطون', 'green')}
              ${commonStats(d)}
            </div>
            <div class="rp-quality"><span class="rp-quality-lbl">جودة سجلات الحفظ:</span>${qualityChips(d.memorization?.quality)}</div>
            <div class="rp-scroll"><table class="mq-table">
              <thead><tr><th style="width:75px;">الكود</th><th>الطالب</th><th style="text-align:center;">الحضور</th><th style="text-align:center;">الغياب</th><th style="text-align:center;">الاختبارات</th><th>الحفظ</th></tr></thead>
              <tbody>${rows}</tbody></table></div>`;
    }

    loadCenter();
    initTeachers();
})();
</script>
</body>
</html>

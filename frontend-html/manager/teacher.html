<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المحفّظ | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(async function () {
    // الفحص الحاسم في الخادم (بوابة manager + تضييق المركز داخل المتحكم)
    const user = Auth.requireAuth(['center_manager']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'teachers', title: 'تفاصيل المحفّظ' });

    const id = new URLSearchParams(location.search).get('id');
    if (!id) { pc.innerHTML = '<div class="mq-empty"><h3>لا يوجد محفّظ محدّد</h3></div>'; return; }

    const esc = UI.escapeHtml;
    const meta = (lbl, val) => `<div class="mq-center-meta-item">
        <div class="mq-center-meta-lbl">${lbl}</div>
        <div class="mq-center-meta-val">${esc(val ?? '—')}</div></div>`;
    const stat = (v, l, k, sub = '') => `<div class="mq-stat ${k}"><span class="mq-stat-ico">${UI.star(22)}</span>
        <div><div class="mq-stat-val">${v}</div><div class="mq-stat-lbl">${l}</div>${sub ? `<div class="mq-stat-sub">${sub}</div>` : ''}</div></div>`;

    let data;
    try {
        data = (await API.get('/manager/teachers/' + encodeURIComponent(id) + '/performance')).data;
    } catch (e) {
        pc.innerHTML = `<div class="mq-empty"><h3>تعذّر عرض المحفّظ</h3><p>${esc(e.message)}</p></div>`;
        return;
    }
    const t = data.teacher || {}, st = data.stats || {}, students = data.students || [];
    const monthLbl = `${st.month}/${st.year}`;
    const isPrimary = t.type === 'محفظ أساسي';

    const rows = students.length ? students.map(s => `
        <tr>
          <td>${s.display_code ? `<span class="mq-code">${esc(s.display_code)}</span>` : '—'}</td>
          <td><div style="font-weight:600;">${esc(s.name)}</div>
            <div style="font-size:11.5px;color:#9DB3A6;">${esc(s.guardian_name || '')}</div></td>
          <td>${s.age ?? '—'}</td>
          <td style="text-align:center;">${s.attendance_total ? UI.badge(s.attendance_percent + '%', s.attendance_percent >= 70 ? 'success' : 'danger') : '<span style="color:#9DB3A6;">—</span>'}</td>
          <td style="text-align:center;">${s.tests_total ? `${s.tests_passed} / ${s.tests_total}` : '<span style="color:#9DB3A6;">—</span>'}</td>
          <td>${s.completed_quran
              ? UI.badge('ختمة كاملة', 'success')
              : `<span style="font-weight:700;color:#04532F;">${s.completed_juz}</span> <span style="font-size:12px;color:#7A8F82;">جزءاً${s.last_surah ? ' · آخر سورة: ' + esc(s.last_surah) : ''}</span>`}</td>
        </tr>`).join('')
        : `<tr><td colspan="6" style="text-align:center;color:#9DB3A6;padding:22px;">لا يوجد طلاب مسجلون</td></tr>`;

    pc.innerHTML = `
        <a class="mq-btn mq-btn--secondary mq-btn--sm" href="teachers.html" style="margin-bottom:16px;">→ العودة لمحفّظي مركزي</a>

        <div class="mq-card" style="margin-bottom:20px;"><div class="mq-card-body mq-center-head">
          <div class="mq-center-head-top">
            <span class="mq-avatar mq-manager-avatar">${UI.initial(t.name)}</span>
            <h2 class="mq-center-name">${esc(t.name || '—')}</h2>
            ${t.display_code ? `<span class="mq-code" style="font-size:14px;">${esc(t.display_code)}</span>` : ''}
            ${isPrimary ? UI.badge('محفظ أساسي', 'success') : UI.badge('محفظ معاون', 'secondary')}
            ${t.is_active ? UI.badge('نشط', 'success') : UI.badge('موقوف', 'danger')}
          </div>
          <div class="mq-center-meta">
            ${meta('✉️ البريد', t.email)}${meta('📞 الهاتف', t.phone)}${meta('🏫 المركز', t.center_name)}
            ${meta('📅 تاريخ الإضافة', t.created_at ? UI.fmtDate(t.created_at) : null)}
          </div>
        </div></div>

        <div class="mq-stats">
          ${stat(st.students_active ?? 0, 'طالب نشط', 'green', (st.students_inactive ?? 0) ? `و${st.students_inactive} موقوف` : '')}
          ${stat((st.attendance_percent ?? 0) + '%', 'نسبة حضور طلابه (' + monthLbl + ')', 'blue',
              `حاضر ${st.attendance_month?.present ?? 0} من ${st.attendance_month?.total ?? 0} سجلاً`)}
          ${stat(st.performance_score ?? 0, 'مؤشر الأداء', 'gold', 'نسبة النجاح + نصف نسبة الحضور (تعريف تقرير أداء المحفّظين)')}
          ${stat((st.tests_month?.pass_percent ?? 0) + '%', 'نجاح اختبارات الشهر', 'gold',
              `ناجح ${st.tests_month?.passed ?? 0} من ${st.tests_month?.total ?? 0} اختباراً`)}
          ${stat(st.avg_completed_juz ?? 0, 'متوسط الأجزاء المكتملة', 'blue', 'لكل طالب نشط — بالسور المكتملة')}
          ${stat(st.khatmat ?? 0, 'ختمات منسوبة إليه', (st.khatmat ?? 0) ? 'gold' : 'green', 'طلابه الحاليون الذين أتمّوا 30 جزءاً')}
        </div>

        <div class="mq-section"><h3 class="mq-section-title">👥 الطلاب المسجلون عنده</h3>
          <span class="mq-section-count">${students.length ? `${students.length} طالباً نشطاً` : ''}</span></div>
        <div class="mq-card"><div class="rp-scroll"><table class="mq-table">
          <thead><tr><th style="width:75px;">الكود</th><th>الطالب</th><th style="width:70px;">العمر</th><th style="width:110px;text-align:center;">حضور الشهر</th><th style="width:120px;text-align:center;">اختبارات الشهر</th><th>تقدّم الحفظ</th></tr></thead>
          <tbody>${rows}</tbody></table></div></div>`;
})();
</script>
</body>
</html>

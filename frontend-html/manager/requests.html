<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات مركزي | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(function () {
    const user = Auth.requireAuth(['center_manager']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'requests', title: 'طلبات مركزي' });
    let statusFilter = 'pending';

    const statusBadge = (s) => s === 'approved' ? UI.badge('معتمد', 'success')
        : s === 'rejected' ? UI.badge('مرفوض', 'danger') : UI.badge('قيد المراجعة', 'warning');

    // نوع الطلب من منظور مركزي: إضافة (من محفّظيّ) / نقل وارد (من مركز آخر إليّ) / نقل صادر (منّي إلى مركز آخر)
    const kindBadge = (r) => r.type === 'add' ? UI.badge('إضافة', 'info')
        : r.direction === 'outgoing' ? UI.badge('نقل صادر', 'secondary') : UI.badge('نقل وارد', 'primary');

    // من ← إلى (مركز/محفّظ) حسب النوع
    const route = (r) => {
        if (r.type === 'add') return `إلى المحفّظ ${UI.escapeHtml(r.target_teacher || '—')}`;
        const from = `${UI.escapeHtml(r.from_center || '—')} / ${UI.escapeHtml(r.from_teacher || 'بلا محفّظ')}`;
        const to   = `${UI.escapeHtml(r.target_center || '—')}${r.target_teacher ? ' / ' + UI.escapeHtml(r.target_teacher) : ''}`;
        return `${from} ← ${to}`;
    };

    // ===== رفض طلب وارد (سبب اختياري) =====
    function openReject(id) {
        UI.formModal({
            title: 'رفض الطلب', submitText: 'رفض الطلب',
            fields: [{ name: 'admin_note', label: 'سبب الرفض (اختياري)', type: 'textarea', placeholder: 'مثال: المركز مكتمل العدد' }],
            onSubmit: async (v, h) => {
                await API.post('/manager/student-requests/' + id + '/reject', v);
                UI.toast('تم رفض الطلب'); h.close(); load();
            }
        });
    }

    // ===== اعتماد طلب وارد =====
    // إضافة: تنفيذ مباشر. نقل وارد: اختيار محفّظ من مركزي (اختياري — وإلا بقي الطالب بلا محفّظ ليُوزَّع لاحقاً)
    async function approve(r) {
        if (r.type === 'add') {
            try {
                const res = await API.post('/manager/student-requests/' + r.id + '/approve');
                UI.toast(res.message || 'تم اعتماد الطلب'); load();
            } catch (e) { UI.toast(e.message, 'danger'); }
            return;
        }
        let teachers = [];
        try {
            const t = await API.get('/manager/teachers?status=active&all=1');
            teachers = t.data || [];
        } catch (e) { /* القائمة اختيارية */ }
        UI.formModal({
            title: `اعتماد نقل «${r.student_name || ''}» إلى مركزي`,
            submitText: 'اعتماد وتنفيذ النقل',
            fields: [{
                name: 'target_teacher_id', label: 'المحفّظ المستلِم (اختياري)', type: 'select', value: '',
                options: [{ value: '', label: 'بلا محفّظ الآن — يُوزَّع لاحقاً' }]
                    .concat(teachers.map(t => ({ value: t.id, label: t.name + (t.type ? ' (' + t.type + ')' : '') }))),
                help: 'سيُنقل الطالب إلى مركزك فور الاعتماد',
            }],
            onSubmit: async (v, h) => {
                const body = v.target_teacher_id ? { target_teacher_id: v.target_teacher_id } : {};
                const res = await API.post('/manager/student-requests/' + r.id + '/approve', body);
                UI.toast(res.message || 'تم اعتماد الطلب وتنفيذ النقل'); h.close(); load();
            }
        });
    }

    // ===== طلب نقل طالب من مركزي إلى مركز آخر (يستقبله مدير المركز المستهدف) =====
    async function openTransfer() {
        let students = [], centers = [];
        try {
            const [s, c] = await Promise.all([
                API.get('/manager/students?status=active&all=1'),
                API.get('/manager/centers'),
            ]);
            students = s.data || []; centers = c.data || [];
        } catch (e) { UI.toast(e.message, 'danger'); return; }
        if (!centers.length) { UI.toast('لا توجد مراكز نشطة أخرى لنقل الطالب إليها', 'danger'); return; }
        if (!students.length) { UI.toast('لا يوجد طلاب نشطون في مركزك', 'danger'); return; }

        UI.formModal({
            title: 'طلب نقل طالب إلى مركز آخر',
            submitText: 'إرسال طلب النقل',
            fields: [
                { name: 'student_id', label: 'الطالب (من مركزي)', type: 'select', required: true,
                  options: students.map(s => ({ value: s.id, label: `${s.display_code ? s.display_code + ' — ' : ''}${s.name}${s.teacher ? ' (' + s.teacher.name + ')' : ''}` })) },
                { name: 'target_center_id', label: 'المركز المستهدف', type: 'select', required: true,
                  options: centers.map(c => ({ value: c.id, label: c.name + (c.city ? ' — ' + c.city : '') })),
                  help: 'يصل الطلب إلى مدير المركز المستهدف، ويُنفَّذ النقل بعد موافقته' },
            ],
            onSubmit: async (v, h) => {
                const res = await API.post('/manager/student-requests', v);
                UI.toast(res.message || 'تم إرسال طلب النقل'); h.close(); load();
            }
        });
    }

    async function load() {
        pc.innerHTML = '<div class="mq-card"><div class="mq-card-body">جارٍ التحميل...</div></div>';
        try {
            const res = await API.get('/manager/student-requests?status=' + statusFilter);
            const reqs = res.data || [];
            const byId = {};
            reqs.forEach(r => byId[r.id] = r);

            const rows = reqs.map(r => `
                <tr>
                  <td>${kindBadge(r)}</td>
                  <td><div style="font-weight:600;">${UI.escapeHtml(r.student_name || '—')}</div>
                    <div style="font-size:12px;color:#9DB3A6;direction:ltr;text-align:right;">${UI.escapeHtml(r.national_id || '—')}</div></td>
                  <td>${UI.escapeHtml(r.requested_by || '—')}</td>
                  <td style="font-size:13px;">${route(r)}</td>
                  <td style="white-space:nowrap;">${UI.fmtDate(r.created_at)}</td>
                  <td>${r.status === 'pending' && r.direction === 'incoming'
                        ? `<div class="mq-actions">
                             <button class="mq-btn mq-btn--primary mq-btn--sm" data-approve="${r.id}">اعتماد</button>
                             <button class="mq-btn mq-btn--secondary mq-btn--sm" data-reject="${r.id}">رفض</button>
                           </div>`
                        : statusBadge(r.status)
                          + (r.status === 'pending' ? `<div style="font-size:12px;color:#7A8F82;margin-top:4px;">بانتظار مدير «${UI.escapeHtml(r.target_center || '—')}»</div>` : '')
                          + (r.status === 'rejected' && r.admin_note ? `<div style="font-size:12px;color:#B23A48;margin-top:4px;">${UI.escapeHtml(r.admin_note)}</div>` : '')}</td>
                </tr>`).join('') || `<tr><td colspan="6" style="text-align:center;color:#7A8F82;padding:30px;">لا توجد طلبات</td></tr>`;

            const tab = (key, label) => `<button class="mq-btn ${statusFilter === key ? 'mq-btn--primary' : 'mq-btn--secondary'} mq-btn--sm" data-tab="${key}">${label}</button>`;

            pc.innerHTML = `
                <div style="background:#FBF9EE;border:1px solid rgba(4,83,47,.12);border-radius:12px;padding:11px 15px;font-size:13px;color:#3D6B52;margin-bottom:16px;">
                  ℹ️ <b>الواردة</b> إلى مركزك (إضافة من محفّظيك، أو نقل من مركز آخر إليك) تعتمدها أو ترفضها أنت.
                  <b>الصادرة</b> منك إلى مركز آخر يعتمدها مدير المركز المستهدف.
                </div>
                <div class="mq-toolbar">
                  <div class="mq-search">${UI.ic('search', 18, '#9A7A1E')}<input id="search" placeholder="بحث..."></div>
                  <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    ${tab('pending', 'قيد المراجعة')}${tab('all', 'الكل')}
                    <button class="mq-btn mq-btn--primary mq-btn--sm" id="transfer-btn">${UI.ic('requests', 16)} طلب نقل طالب إلى مركز آخر</button>
                  </div>
                </div>
                <div class="mq-card"><table class="mq-table" id="tbl">
                  <thead><tr><th>النوع</th><th>الطالب</th><th>مقدّم الطلب</th><th>من ← إلى</th><th>التاريخ</th><th>الحالة / الإجراء</th></tr></thead>
                  <tbody>${rows}</tbody></table></div>`;

            UI.bindTableSearch('search', 'tbl');
            pc.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { statusFilter = b.dataset.tab; load(); });
            pc.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => approve(byId[b.dataset.approve]));
            pc.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => openReject(b.dataset.reject));
            document.getElementById('transfer-btn').onclick = openTransfer;
        } catch (e) { UI.toast(e.message, 'danger'); }
    }
    load();
})();
</script>
</body>
</html>

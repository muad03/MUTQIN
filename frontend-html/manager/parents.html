<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أولياء الأمور | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(function () {
    // عرض فقط — النطاق (أولياء أمور مركزه عبر أبنائهم النشطين) يُفرض في الخادم
    const user = Auth.requireAuth(['center_manager']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'parents', title: 'أولياء الأمور' });

    const esc = UI.escapeHtml;

    pc.innerHTML = `
        <div class="mq-toolbar">
          <div class="mq-search">${UI.ic('search', 18, '#9A7A1E')}<input id="search" placeholder="ابحث بالاسم أو الكود أو الهاتف أو الرقم الوطني..."></div>
          <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
            <div style="display:flex;align-items:center;gap:8px;">
              <label class="mq-label" style="margin:0;font-size:13px;white-space:nowrap;">الحالة:</label>
              <select class="mq-input" id="status-filter" style="max-width:150px;">
                <option value="active">النشطون</option>
                <option value="inactive">المعطَّلون</option>
                <option value="all">الكل</option>
              </select>
            </div>
            <span id="counter" style="font-size:13px;color:#7A8F82;font-weight:600;white-space:nowrap;"></span>
          </div>
        </div>
        <div class="mq-card"><div class="rp-scroll"><table class="mq-table" id="tbl">
          <thead><tr><th>ولي الأمر</th><th style="width:80px;">الكود</th><th>الهاتف</th><th>الرقم الوطني</th><th>الأبناء في مركزي</th><th style="width:100px;text-align:center;">الحالة</th></tr></thead>
          <tbody id="par-body"><tr><td colspan="6" style="text-align:center;color:#7A8F82;padding:30px;">جارٍ التحميل...</td></tr></tbody>
        </table></div></div>
        <div style="text-align:center;margin-top:16px;">
          <button class="mq-btn mq-btn--secondary" id="load-more" style="display:none;">عرض المزيد ↓</button>
        </div>`;

    const searchInput = document.getElementById('search');
    const counter = document.getElementById('counter');
    const loadMoreBtn = document.getElementById('load-more');
    const statusFilter = document.getElementById('status-filter');
    let page = 1, lastPage = 1, total = 0, loadedCount = 0, fetchSeq = 0;

    const childrenChips = (kids) => (kids && kids.length)
        ? `<div class="mq-chips">${kids.map(k => `<span class="mq-chip">${k.display_code ? `<span class="mq-chip-code">${esc(k.display_code)}</span>` : ''}${esc(k.name)}</span>`).join('')}</div>`
        : '<span style="color:#9DB3A6;">—</span>';

    async function render(reset = true) {
        if (reset) { page = 1; loadedCount = 0; }
        const seq = ++fetchSeq;
        const body = document.getElementById('par-body');
        if (reset) body.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#7A8F82;padding:20px;">جارٍ التحميل...</td></tr>`;
        loadMoreBtn.disabled = true;
        try {
            const p = new URLSearchParams({ page, status: statusFilter.value });
            const q = searchInput.value.trim();
            if (q) p.set('q', q);
            const res = await API.get('/manager/parents?' + p.toString());
            if (seq !== fetchSeq) return;
            const pg = res.data, batch = pg.data || [];
            lastPage = pg.last_page ?? 1; total = pg.total ?? batch.length;
            const rows = batch.map(g => `
                <tr>
                  <td><div style="display:flex;align-items:center;gap:10px;">
                    <span class="mq-avatar">${UI.initial(g.name)}</span>
                    <div style="font-weight:600;">${esc(g.name)}</div></div></td>
                  <td>${g.display_code ? `<span class="mq-code">${esc(g.display_code)}</span>` : '—'}</td>
                  <td style="direction:ltr;text-align:right;">${esc(g.phone || '—')}</td>
                  <td>${g.id_number ? `<span style="direction:ltr;display:inline-block;font-weight:600;color:#04532F;">${esc(g.id_number)}</span>` : '<span class="mq-badge mq-badge-warning">بدون رقم</span>'}</td>
                  <td>${childrenChips(g.children)}</td>
                  <td style="text-align:center;">${g.is_active ? UI.badge('نشط', 'success') : UI.badge('معطَّل', 'danger')}</td>
                </tr>`).join('');
            const emptyMsg = q
                ? 'لا يوجد ولي أمر مطابق للبحث'
                : (statusFilter.value === 'active'
                    ? 'لا يوجد أولياء أمور نشطون لطلاب مركزك بعد — يُنشأ ولي الأمر عند إضافة طالب'
                    : 'لا يوجد أولياء أمور لطلاب مركزك بهذه الحالة');
            if (reset) body.innerHTML = batch.length ? rows : `<tr><td colspan="6" style="text-align:center;color:#7A8F82;padding:30px;">${emptyMsg}</td></tr>`;
            else body.insertAdjacentHTML('beforeend', rows);
            loadedCount += batch.length;
            counter.textContent = total ? `عرض ${loadedCount} من ${total}` : '';
            loadMoreBtn.style.display = page < lastPage ? '' : 'none';
        } catch (e) {
            if (reset) body.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#B23A48;padding:20px;">${esc(e.message)}</td></tr>`;
        } finally { loadMoreBtn.disabled = false; }
    }

    loadMoreBtn.onclick = () => { page++; render(false); };
    statusFilter.addEventListener('change', () => render(true));
    let t = null;
    searchInput.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => render(true), 300); });
    render(true);
})();
</script>
</body>
</html>
